{% extends "base.html" %}

{% block content %}

<style>

    .add-member-page {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px 0;
    }

    .member-form-card {
        width: 100%;
        max-width: 520px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 35px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
    }

    .form-header {
        margin-bottom: 28px;
    }

    .form-header h1 {
        margin: 0 0 8px;
        font-size: 26px;
        color: #111827;
    }

    .form-header p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
    }

    .group-name {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 10px;
        background: #eef2ff;
        color: #4f46e5;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    .form-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        color: #111827;
        outline: none;
    }

    .form-group input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .form-hint {
        margin-top: 7px;
        font-size: 12px;
        color: #6b7280;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .add-btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .add-btn:hover {
        background: #4338ca;
    }

    .cancel-btn {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        color: #374151;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        box-sizing: border-box;
    }

    .cancel-btn:hover {
        background: #f9fafb;
    }

</style>


<div class="add-member-page">

    <div class="member-form-card">

        <div class="form-header">

            <h1>Add Member</h1>

            <p>
                Add a registered SplitEase user to this group.
            </p>

            <span class="group-name">
                {{ group.name }}
            </span>

        </div>


        <form method="POST">

            <div class="form-group">

                <label>
                    User Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter user's email"
                    required
                >

                <div class="form-hint">
                    The user must already have a SplitEase account.
                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for('group_details', group_id=group.id) }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="add-btn"
                >
                    Add Member
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
