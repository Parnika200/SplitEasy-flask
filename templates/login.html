{% extends "base.html" %}

{% block content %}

<style>

    .login-page {

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        padding: 30px 20px;

        background: #f8fafc;

    }


    .login-card {

        width: 100%;

        max-width: 440px;

        background: white;

        padding: 40px;

        border: 1px solid #e5e7eb;

        border-radius: 14px;

        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);

    }


    .login-header {

        text-align: center;

        margin-bottom: 30px;

    }


    .login-header h2 {

        margin: 0 0 8px;

        font-size: 28px;

        color: #111827;

    }


    .login-header p {

        margin: 0;

        color: #6b7280;

        font-size: 14px;

    }


    .form-group {

        margin-bottom: 20px;

    }


    .form-group label {

        display: block;

        margin-bottom: 8px;

        font-size: 14px;

        font-weight: 600;

        color: #374151;

    }


    .form-group input {

        width: 100%;

        padding: 12px 14px;

        border: 1px solid #d1d5db;

        border-radius: 8px;

        font-size: 15px;

        outline: none;

    }


    .form-group input:focus {

        border-color: #4f46e5;

        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);

    }


    .login-button {

        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background: #4f46e5;

        color: white;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        margin-top: 5px;

    }


    .login-button:hover {

        background: #4338ca;

    }


    .register-link {

        text-align: center;

        margin-top: 24px;

        font-size: 14px;

        color: #6b7280;

    }


    .register-link a {

        color: #4f46e5;

        font-weight: 600;

    }


    .register-link a:hover {

        text-decoration: underline;

    }

</style>


<div class="login-page">


    <div class="login-card">


        <div class="login-header">

            <h2>
                Welcome Back
            </h2>

            <p>
                Login to continue to SplitEase
            </p>

        </div>


        <form method="POST">


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create an account
            </a>

        </div>


    </div>


</div>

{% endblock %}
