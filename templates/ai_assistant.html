{% extends "base.html" %}

{% block content %}

<h2>AI Expense Assistant 🤖</h2>

<p>Ask questions about your expenses.</p>

<form method="POST">

    <input
        type="text"
        name="question"
        placeholder="Ask something about your expenses..."
        value="{{ question }}"
        style="width: 400px;"
    >

    <button type="submit">
        Ask AI
    </button>

</form>

{% if answer %}

    <hr>

    <h3>AI Response</h3>

    <p>{{ answer }}</p>

{% endif %}

{% endblock %}
